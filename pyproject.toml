[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceover-generator-engine"
version = "0.1.0"
description = "Sanitized reference core for validating festival programs and generating auditable voiceover manifests."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marx Bruno" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
voiceover-manifest = "voiceover_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

